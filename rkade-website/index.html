<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the SVG icon entirely and screenshots the page instead
         when this is missing. Generated from favicon.svg by
         scripts/generate-apple-touch-icon.mjs. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2C2218" />
    <!--
      No charset, title, description, canonical or Open Graph tags here on
      purpose. Every route renders its own through
      src/components/common/Seo.jsx (and charset through RootLayout.jsx),
      which vite-react-ssg's <Head> (a React Helmet wrapper) writes into the
      real prerendered <head> at build time. A static tag here would sit
      alongside the per-route one rather than being replaced by it, since
      the SSG injector inserts rather than overwrites, and the site would
      ship with two of everything, with charset pushed past the byte-1024
      window every reader is supposed to find it in. See docs/GOTCHAS.md.
    -->
    <link rel="preload" href="/fonts/cormorant-garamond-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/montserrat-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
